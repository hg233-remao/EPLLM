name: Build and Release EPLLMv1

on:
  push:
    tags:
      - 'v1'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install nuitka openai requests

      - name: 用 Nuitka 打包
        shell: pwsh
        run: |
          # 从 tag 里取版本号（v1.0.0 -> 1.0.0），拿不到就用默认值
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if ($ver -notmatch '^\d+(\.\d+){1,3}$') { $ver = '1.0.0' }

          python -m nuitka `
            --onefile `
            --enable-plugin=tk-inter `
            --windows-console-mode=disable `
            --windows-icon-from-ico=v1.ico `
            --product-version=$ver `
            --file-version=$ver `
            --company-name=EPLLM `
            --product-name=EPLLMv1 `
            --onefile-tempdir-spec="{CACHE_DIR}\EPLLMv1\{VERSION}" `
            --assume-yes-for-downloads `
            --output-dir=dist `
            EPLLMv1.py

      - name: 上传 exe 为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: EPLLMv1-windows
          path: dist/EPLLMv1.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: EPLLMv1-windows

      - name: 创建 Release 并上传 exe
        uses: softprops/action-gh-release@v2
        with:
          files: EPLLMv1.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
